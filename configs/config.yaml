# RLCache reproducibility config — loaded by dqn_training.py and
# scripts/train_stable_dqn.py via dqn_model.load_config().
#
# Every value here is a *default*: both scripts fall back to these
# hardcoded-turned-configurable numbers if a key is missing or this file
# is absent, so `python dqn_training.py` / `python train_stable_dqn.py`
# still work with zero args. train_stable_dqn.py's CLI flags (--lr,
# --gamma, etc.) override these when passed explicitly.
#
# `seed` is applied via torch.manual_seed / np.random.seed / random.seed
# at the top of both scripts, so runs are reproducible given the same
# replay buffer (previously neither script seeded anything).

seed: 42

# ---------------------------------------------------------------------------
# Canonical DDQN trainer: scripts/train_stable_dqn.py
# ---------------------------------------------------------------------------
train_stable_dqn:
  replay_buffer_csv: ../replay_buffer_cost_aware.csv
  model_path: dqn_cost_aware_net.pth
  device: cpu

  batch_size: 1024
  num_epochs: 3000            # each "epoch" is one sampled-minibatch gradient step over the offline
                               # buffer, not an episodic rollout — there's no online exploration policy
                               # here (offline RL), hence no epsilon schedule below.
  learning_rate: 5.0e-4
  gamma: 0.99                 # discount factor
  tau: 0.005                  # soft (Polyak) target-update coefficient, blended every step
  replay_capacity: 500000

  reward_clip: 5.0            # clamp raw reward to [-reward_clip, reward_clip] before scaling
  reward_scale: 1.0
  grad_clip: 1.0

  lr_scheduler:
    factor: 0.5
    patience: 50               # scheduler.step() calls (each call happens every 10 epochs, so this is ~500 epochs of patience)

  target_update_frequency: null   # N/A — soft update every step, not a periodic hard sync (see tau)
  checkpoint_every_epochs: 500

  epsilon_schedule: null      # N/A — offline RL trains on a fixed logged buffer; no online
                               # exploration/epsilon-greedy policy exists in this pipeline

  network:
    hidden_dim: 256
    layer_norm: true

# ---------------------------------------------------------------------------
# Legacy vanilla-DQN trainer: dqn_training.py (superseded by
# train_stable_dqn.py — kept configurable for comparison/reproducibility).
# ---------------------------------------------------------------------------
dqn_training:
  replay_buffer_csv: replay_buffer_multi_policy.csv
  model_path: dqn_policy_net.pth
  training_log_csv: training_log.csv

  num_actions: 6               # cache_length (5) + 1 "no eviction" action; state_dim is inferred
                                # from the replay buffer CSV itself (see generate_offline_data_from_cache),
                                # not hardcoded — canonically 38 (dqn_model.STATE_DIM)
  batch_size: 128
  num_epochs: 50
  learning_rate: 5.0e-4
  gamma: 0.98                  # discount factor
  target_update_frequency_epochs: 5   # hard sync (full state_dict copy), not soft
  checkpoint_every_epochs: 10

  epsilon_schedule: null       # N/A — offline RL, no online exploration policy (see train_stable_dqn note above)

  network:
    hidden_dim: 128

# ---------------------------------------------------------------------------
# Cache / executor simulator (executor.py, evaluate_policies.py) — not yet
# wired in (both scripts still hardcode these); documented here for
# reference and as a follow-up wiring target.
# ---------------------------------------------------------------------------
simulator:
  max_cache_size_mb: 512         # Executor default; evaluate_policies.py overrides to 10, executor.py's __main__ to 20
  cache_slots_k: 5               # partitions pre-loaded/held in cache; drives the RL action-space size (k + 1)
  default_eviction_policy: LRU
  rl_model_path: dqn_policy_net.pth   # default checkpoint Executor loads for the "RL" policy

  eviction_policies:
    - LRU
    - LFU
    - FIFO
    - RANDOM
    - RL

  synthetic_workload:
    n_partitions_sales: 20
    n_partitions_customer: 10
    n_workloads_per_policy: 1500
